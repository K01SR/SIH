services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: aicte-workflow-server:latest
    container_name: aicte-server
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "file:/app/data/prod.db"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production-min-16-chars}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-8h}"
      CLIENT_URL: "${CLIENT_URL:-http://localhost:8080}"
      UPLOAD_DIR: "/app/uploads"
      ESCALATION_CRON: "${ESCALATION_CRON:-*/5 * * * *}"
      ENABLE_SCHEDULER: "${ENABLE_SCHEDULER:-true}"
      SEED_ON_START: "${SEED_ON_START:-true}"
      SEED_FORCE: "${SEED_FORCE:-false}"
    volumes:
      - aicte_data:/app/data
      - aicte_uploads:/app/uploads
    ports:
      - "${SERVER_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: aicte-workflow-client:latest
    container_name: aicte-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aicte_data:
  aicte_uploads:
