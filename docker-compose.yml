services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aicte-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "file:/app/data/prod.db"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production-min-16-chars}"
      JWT_EXPIRES_IN: "8h"
      CLIENT_URL: "${CLIENT_URL:-http://localhost:8080}"
      UPLOAD_DIR: "/app/uploads"
      ESCALATION_CRON: "*/5 * * * *"
      ENABLE_SCHEDULER: "true"
      SEED_ON_START: "${SEED_ON_START:-true}"
    volumes:
      - aicte_data:/app/data
      - aicte_uploads:/app/uploads
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: aicte-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  aicte_data:
  aicte_uploads:
